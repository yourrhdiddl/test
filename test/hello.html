<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 48px 64px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 12px; font-size: 3rem; }
    p { margin: 0; font-size: 1.1rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World! 👋</h1>
    <p>안녕하세요! 첫 번째 HTML 페이지입니다.</p>
  </div>
</body>
</html>
