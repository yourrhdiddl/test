<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>셀렉트마켓 · 이번 주 특가</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --card: #ffffff;
      --line: #dfe8f5;
      --text: #1d2433;
      --muted: #61708a;
      --blue: #2457f5;
      --blue-soft: #edf3ff;
      --shadow: 0 18px 40px rgba(24, 39, 75, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--blue);
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3c71ff 0%, #7ea2ff 100%);
      box-shadow: 0 0 0 6px rgba(36, 87, 245, 0.12);
    }

    .hero {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(223, 232, 245, 0.9);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .deal-list {
      display: grid;
      gap: 18px;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 22px;
      box-shadow: 0 8px 18px rgba(18, 36, 69, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(18, 36, 69, 0.06);
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f2f6ff;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h2 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .price-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--blue);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .price {
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      letter-spacing: -0.04em;
    }

    .old-price {
      color: #98a5bc;
      font-size: 0.9rem;
      text-decoration: line-through;
      font-weight: 600;
    }

    .footer-note {
      max-width: 760px;
      margin: 22px auto 0;
      padding: 0 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 540px) {
      .page {
        padding-top: 28px;
      }

      .hero {
        padding: 24px 20px;
      }

      .card {
        flex-direction: column;
        align-items: flex-start;
      }

      .price-wrap {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>셀렉트마켓</span>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">THIS WEEK</div>
      <h1>이번 주 특가 3가지</h1>
      <p class="subtitle">업무 효율과 생활 편의를 한 번에 챙길 수 있는 베스트 아이템을 준비했어요.</p>
    </section>

    <main class="deal-list">
      <article class="card">
        <div class="item-meta">
          <span class="tag">BEST</span>
          <h2>무선 마우스</h2>
        </div>
        <div class="price-wrap">
          <span class="price">19,000원</span>
          <span class="old-price">29,000원</span>
        </div>
      </article>

      <article class="card">
        <div class="item-meta">
          <span class="tag">NEW</span>
          <h2>노트북 거치대</h2>
        </div>
        <div class="price-wrap">
          <span class="price">25,000원</span>
          <span class="old-price">35,000원</span>
        </div>
      </article>

      <article class="card">
        <div class="item-meta">
          <span class="tag">HOT</span>
          <h2>USB-C 충전기</h2>
        </div>
        <div class="price-wrap">
          <span class="price">15,000원</span>
          <span class="old-price">21,000원</span>
        </div>
      </article>
    </main>
  </div>

  <footer class="footer-note">
    고객센터 평일 10:00–17:00
  </footer>
</body>
</html>
